<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПРАВДА</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Onest:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --accent: #ff3c6e;
    --accent2: #ff8c42;
    --text: #f0eee8;
    --muted: #6b6880;
    --border: #1e1e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  .screen { display: none; }
  .screen.active { display: flex; }

  /* ===== INTRO SCREEN ===== */
  #intro {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
    position: relative;
  }

  .glow-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
  }
  .blob1 { width: 400px; height: 400px; background: rgba(255,60,110,0.12); top: -100px; left: -100px; }
  .blob2 { width: 300px; height: 300px; background: rgba(255,140,66,0.08); bottom: 0; right: -80px; }

  .logo {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(56px, 15vw, 120px);
    font-weight: 900;
    letter-spacing: -4px;
    line-height: 1;
    background: linear-gradient(135deg, #ff3c6e, #ff8c42);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }

  .tagline {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 40px;
  }

  /* ===== VERSION TABS ===== */
  .version-tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 4px;
    margin-bottom: 40px;
  }
  .version-tab {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .version-tab.active {
    background: linear-gradient(135deg, #ff3c6e, #ff8c42);
    color: white;
  }
  .version-tab:not(.active):hover { color: var(--text); }

  .categories-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 500px;
    margin-bottom: 32px;
  }

  .cat-tag {
    padding: 8px 16px;
    border-radius: 100px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .cat-tag.selected { opacity: 1; }
  .cat-tag.unselected { opacity: 0.35; }

  /* V1 category colors */
  .cat-tag[data-cat="shame"]    { color: #ff6b9d; border-color: #ff6b9d33; background: #ff6b9d0d; }
  .cat-tag[data-cat="deep"]     { color: #a78bfa; border-color: #a78bfa33; background: #a78bfa0d; }
  .cat-tag[data-cat="social"]   { color: #34d399; border-color: #34d39933; background: #34d3990d; }
  .cat-tag[data-cat="romantic"] { color: #fb923c; border-color: #fb923c33; background: #fb923c0d; }
  .cat-tag[data-cat="wild"]     { color: #f59e0b; border-color: #f59e0b33; background: #f59e0b0d; }

  .cat-tag.selected[data-cat="shame"]    { background: #ff6b9d22; }
  .cat-tag.selected[data-cat="deep"]     { background: #a78bfa22; }
  .cat-tag.selected[data-cat="social"]   { background: #34d39922; }
  .cat-tag.selected[data-cat="romantic"] { background: #fb923c22; }
  .cat-tag.selected[data-cat="wild"]     { background: #f59e0b22; }

  /* V2 category colors */
  .cat-tag[data-cat="psych"]       { color: #818cf8; border-color: #818cf833; background: #818cf80d; }
  .cat-tag[data-cat="honest"]      { color: #2dd4bf; border-color: #2dd4bf33; background: #2dd4bf0d; }
  .cat-tag[data-cat="dark"]        { color: #c084fc; border-color: #c084fc33; background: #c084fc0d; }
  .cat-tag[data-cat="players_cat"] { color: #fb7185; border-color: #fb718533; background: #fb71850d; }

  .cat-tag.selected[data-cat="psych"]       { background: #818cf822; }
  .cat-tag.selected[data-cat="honest"]      { background: #2dd4bf22; }
  .cat-tag.selected[data-cat="dark"]        { background: #c084fc22; }
  .cat-tag.selected[data-cat="players_cat"] { background: #fb718522; }

  /* ===== PLAYER MANAGEMENT ===== */
  .player-section {
    width: 100%;
    max-width: 500px;
    margin-bottom: 32px;
  }
  .player-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .player-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Onest', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .player-input:focus { border-color: var(--accent); }
  .add-player-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    font-size: 13px;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .add-player-btn:hover { border-color: var(--accent); color: var(--accent); }

  .player-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .player-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 12px 6px 14px;
    font-size: 13px;
    color: var(--text);
  }
  .chip-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0;
    transition: color 0.2s;
  }
  .chip-remove:hover { color: var(--accent); }

  .player-hint {
    font-size: 12px;
    color: #fb7185;
    margin-top: 10px;
    letter-spacing: 0.5px;
    min-height: 18px;
  }

  .start-btn {
    background: linear-gradient(135deg, #ff3c6e, #ff8c42);
    border: none;
    color: white;
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 18px 48px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 40px rgba(255,60,110,0.3);
  }
  .start-btn:hover { transform: scale(1.04); box-shadow: 0 0 60px rgba(255,60,110,0.45); }
  .start-btn:active { transform: scale(0.98); }

  .count-info {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ===== GAME SCREEN ===== */
  #game {
    flex-direction: column;
    min-height: 100vh;
    padding: 24px 20px;
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
  }

  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    font-family: 'Onest', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--muted); color: var(--text); }

  .progress-area { flex: 1; margin: 0 20px; }

  .progress-bar-track {
    height: 3px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3c6e, #ff8c42);
    border-radius: 100px;
    transition: width 0.4s ease;
  }
  .progress-label {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .game-logo {
    font-family: 'Unbounded', sans-serif;
    font-size: 16px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff3c6e, #ff8c42);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .question-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }

  .cat-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 24px;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid;
    transition: all 0.3s;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    width: 100%;
    position: relative;
    overflow: hidden;
    transition: all 0.4s;
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #ff3c6e, #ff8c42);
    opacity: 0.6;
  }

  .question-number {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .question-text {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 400;
    line-height: 1.5;
    color: var(--text);
    transition: opacity 0.3s;
  }

  .question-card.animating .question-text { opacity: 0; }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 32px;
    width: 100%;
  }

  .btn-next {
    flex: 1;
    background: linear-gradient(135deg, #ff3c6e, #ff8c42);
    border: none;
    color: white;
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 18px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 32px rgba(255,60,110,0.25);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(255,60,110,0.35); }
  .btn-next:active { transform: translateY(0); }

  .btn-skip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Onest', sans-serif;
    font-size: 13px;
    padding: 18px 24px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-skip:hover { border-color: var(--muted); color: var(--text); }

  /* ===== END SCREEN ===== */
  #end {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
  }

  .end-emoji { font-size: 72px; margin-bottom: 24px; }
  .end-title {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 900;
    background: linear-gradient(135deg, #ff3c6e, #ff8c42);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .end-sub { color: var(--muted); font-size: 15px; margin-bottom: 40px; line-height: 1.6; }
  .restart-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Unbounded', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 16px 36px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .restart-btn:hover { background: var(--accent); color: white; }

  /* ===== PLAYER NAME HIGHLIGHT ===== */
  .player-name {
    background: linear-gradient(135deg, #ff3c6e22, #ff8c4222);
    border: 1px solid #ff3c6e44;
    border-radius: 6px;
    padding: 1px 7px;
    color: #ff8c42;
    font-weight: 500;
  }
  .player-name--alt {
    background: linear-gradient(135deg, #fb718522, #c084fc22);
    border-color: #fb718544;
    color: #fb7185;
  }

  @media (max-width: 480px) {
    .question-card { padding: 36px 24px; }
    .controls { flex-direction: column; }
    .version-tab { padding: 10px 14px; font-size: 10px; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro" class="screen active">
  <div class="glow-blob blob1"></div>
  <div class="glow-blob blob2"></div>
  <div class="logo">ПРАВДА</div>
  <div class="tagline" id="tagline">200 вопросов · 18+</div>

  <div class="version-tabs">
    <button class="version-tab active" data-version="v1" onclick="switchVersion('v1')">КЛАССИКА</button>
    <button class="version-tab" data-version="v2" onclick="switchVersion('v2')">ВЕРСИЯ 2.0 ✨</button>
  </div>

  <div class="categories-preview" id="cats-v1">
    <span class="cat-tag selected" data-cat="shame">😳 Стыдное</span>
    <span class="cat-tag selected" data-cat="deep">🌀 Глубокое</span>
    <span class="cat-tag selected" data-cat="social">👥 Социальное</span>
    <span class="cat-tag selected" data-cat="romantic">🔥 Романтика</span>
    <span class="cat-tag selected" data-cat="wild">🤪 Безумное</span>
  </div>

  <div class="categories-preview" id="cats-v2" style="display:none">
    <span class="cat-tag selected" data-cat="psych">🧠 Психология</span>
    <span class="cat-tag selected" data-cat="honest">🎯 Честность</span>
    <span class="cat-tag selected" data-cat="dark">🌑 Тёмная сторона</span>
    <span class="cat-tag selected" data-cat="players_cat">👤 С игроками</span>
  </div>

  <div class="player-section" id="player-section" style="display:none">
    <div class="player-input-row">
      <input type="text" id="player-input" class="player-input"
             placeholder="Имя игрока..." maxlength="20"
             onkeydown="if(event.key==='Enter') addPlayer()">
      <button class="add-player-btn" onclick="addPlayer()">+ Добавить</button>
    </div>
    <div class="player-chips" id="player-chips"></div>
    <div class="player-hint" id="player-hint"></div>
  </div>

  <button class="start-btn" onclick="startGame()">НАЧАТЬ ИГРУ</button>
  <div class="count-info" id="count-info">200 вопросов выбрано</div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">← Назад</button>
    <div class="progress-area">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="progress-label" id="progress-label">0 / 0</div>
    </div>
    <div class="game-logo" id="game-logo">ПРАВДА</div>
  </div>

  <div class="question-area">
    <div class="cat-badge" id="cat-badge">—</div>
    <div class="question-card" id="question-card">
      <div class="question-number" id="question-number">ВОПРОС 1</div>
      <div class="question-text" id="question-text">...</div>
    </div>
    <div class="controls">
      <button class="btn-next" onclick="nextQuestion()">СЛЕДУЮЩИЙ →</button>
      <button class="btn-skip" onclick="skipQuestion()">Пропустить</button>
    </div>
  </div>
</div>

<!-- END -->
<div id="end" class="screen">
  <div class="end-emoji">🎉</div>
  <div class="end-title">Вопросы кончились</div>
  <div class="end-sub">Надеемся, вы узнали друг о друге<br>что-то интересное (или пожалели)</div>
  <button class="restart-btn" onclick="restartGame()">Сыграть снова</button>
</div>

<script>
const QUESTIONS = {
  shame: [
    "Какой твой самый позорный момент в жизни?",
    "Что-то такое, за что тебе до сих пор стыдно, но ты никому не рассказывал?",
    "Самое неловкое, что с тобой случалось при людях?",
    "Ты когда-нибудь притворялся, что не знаешь человека, чтобы избежать разговора?",
    "Самая глупая причина, по которой ты плакал?",
    "Что-то, что ты делал в одиночестве и надеешься, что никто не видел?",
    "Самый стыдный поиск в твоём браузере за последний месяц?",
    "Ты когда-нибудь врал о том, что читал какую-то книгу или смотрел фильм?",
    "Самый дурацкий страх, который у тебя есть?",
    "Что-то, что ты купил в интернете и стыдишься признать?",
    "Ты когда-нибудь воровал? Что именно?",
    "Самое неловкое сообщение, которое ты отправил не тому человеку?",
    "Что ты делал на последней вечеринке, о чём теперь жалеешь?",
    "Признайся в чём-то, за что тебя могут осудить здесь присутствующие",
    "Самая нелепая вещь, которой ты боялся в детстве и до сих пор немного боишься?",
    "Тебя когда-нибудь ловили на лжи в самый неподходящий момент?",
    "Что-то постыдное, что ты делал ради денег?",
    "Самая странная привычка, о которой почти никто не знает?",
    "Ты когда-нибудь симулировал болезнь, чтобы избежать чего-то?",
    "Какой твой тайный порок, который ты тщательно скрываешь?",
    "Самое смущающее, что ты когда-либо гуглил?",
    "Признайся в чём-то, чего ты никогда не делал, но все думают, что делал",
    "Ты когда-нибудь читал чужую переписку? Чью?",
    "Что-то, что ты до сих пор делаешь по-детски, хотя давно взрослый?",
    "Самый неловкий момент на свидании или попытке флирта?",
    "Ты когда-нибудь плакал от злости и пытался скрыть это?",
    "Что-то, что ты ел тайком, потому что стыдно признавать?",
    "Самый странный сон, который ты запомнил и не хочешь рассказывать?",
    "Ты когда-нибудь провалил что-то важное из-за банальной лени?",
    "Что ты сделал из зависти к кому-то из присутствующих?",
    "Самое неловкое, что с тобой случилось из-за алкоголя?",
    "Что ты до сих пор не умеешь делать, хотя все думают, что умеешь?",
    "Ты когда-нибудь притворялся, что спишь, чтобы не разговаривать?",
    "Самый дурацкий повод, по которому ты поссорился с кем-то близким?",
    "Что-то, о чём ты врал родителям и так и не признался?",
    "Ты когда-нибудь ставил дизлайк из зависти?",
    "Самый позорный текст или пост, который ты когда-либо написал?",
    "Что ты делаешь наедине с собой, о чём точно не расскажешь первым?",
    "Ты когда-нибудь использовал кого-то ради выгоды и потом сожалел об этом?",
    "Самая глупая трата денег за последний год?"
  ],
  deep: [
    "Что тебя пугает в самом себе?",
    "Есть ли что-то, что ты так и не простил себе?",
    "Какой момент в жизни изменил тебя больше всего?",
    "Что ты хотел бы сказать человеку, которого уже нет рядом?",

    "Если бы {other_player} нуждался в помощи в 3 ночи — позвонил бы {player}?",
    "{player}, есть ли кто-то в этой комнате, с кем ты хотел бы поговорить наедине?",
    "Что {player} никогда не признает публично — но все и так знают?",
    "{player}, твой честный ответ: ты счастлив прямо сейчас?",
    "Если бы {player} и {other_player} поменялись жизнями на неделю — что изменилось бы?",
    "{player}, что ты думаешь о себе, когда никто не смотрит?"
  ]
};

let deck = [];
let currentIndex = 0;
let currentVersion = 'v1';
let players = [];

// Category toggle — event delegation covers both V1 and V2 tags
document.getElementById('intro').addEventListener('click', function(e) {
  if (e.target.classList.contains('cat-tag')) {
    e.target.classList.toggle('selected');
    e.target.classList.toggle('unselected');
    updateCount();
  }
});

function switchVersion(ver) {
  currentVersion = ver;
  document.querySelectorAll('.version-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.version === ver));
  document.getElementById('cats-v1').style.display = ver === 'v1' ? 'flex' : 'none';
  document.getElementById('cats-v2').style.display = ver === 'v2' ? 'flex' : 'none';
  document.getElementById('player-section').style.display = ver === 'v2' ? 'block' : 'none';
  document.getElementById('tagline').textContent = ver === 'v2' ? '100 вопросов · 18+' : '200 вопросов · 18+';
  updateCount();
}

function getSelectedCats() {
  const containerId = currentVersion === 'v1' ? 'cats-v1' : 'cats-v2';
  return [...document.querySelectorAll('#' + containerId + ' .cat-tag.selected')]
    .map(t => t.dataset.cat);
}

function updateCount() {
  const cats = getSelectedCats();
  const source = currentVersion === 'v1' ? QUESTIONS : QUESTIONS_V2;
  let total = cats.reduce((sum, c) => sum + (source[c] ? source[c].length : 0), 0);
  document.getElementById('count-info').textContent = total + ' вопросов выбрано';
  if (currentVersion === 'v2') {
    const needsPlayers = cats.includes('players_cat');
    const enoughPlayers = players.length >= 2;
    const hint = document.getElementById('player-hint');
    hint.textContent = (needsPlayers && !enoughPlayers)
      ? 'Добавь минимум 2 игрока для категории «С игроками»'
      : '';
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  const cats = getSelectedCats();
  if (!cats.length) { alert('Выбери хотя бы одну категорию!'); return; }
  if (currentVersion === 'v2' && cats.includes('players_cat') && players.length < 2) {
    alert('Добавь минимум 2 игрока для категории «С игроками»!');
    return;
  }

  const source = currentVersion === 'v1' ? QUESTIONS : QUESTIONS_V2;
  deck = [];
  cats.forEach(cat => {
    source[cat].forEach(q => deck.push({ cat, q }));
  });
  deck = shuffle(deck);
  currentIndex = 0;

  document.getElementById('game-logo').textContent = currentVersion === 'v2' ? 'ПРАВДА 2.0' : 'ПРАВДА';

  showScreen('game');
  renderQuestion();
}

function sanitizeName(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function substitutePlayersHTML(q) {
  if (players.length < 2) return q;
  const i1 = Math.floor(Math.random() * players.length);
  let i2;
  do { i2 = Math.floor(Math.random() * players.length); } while (i2 === i1);
  const p1 = sanitizeName(players[i1]);
  const p2 = sanitizeName(players[i2]);
  return q
    .replace(/\{player\}/g, '<span class="player-name">' + p1 + '</span>')
    .replace(/\{other_player\}/g, '<span class="player-name player-name--alt">' + p2 + '</span>');
}

function renderQuestion() {
  if (currentIndex >= deck.length) {
    showScreen('end');
    return;
  }
  const { cat, q } = deck[currentIndex];
  const labelMap = currentVersion === 'v2' ? CAT_LABELS_V2 : CAT_LABELS;
  const info = labelMap[cat];

  const badge = document.getElementById('cat-badge');
  badge.textContent = info.emoji + ' ' + info.label;
  badge.style.color = info.color;
  badge.style.borderColor = info.color + '44';
  badge.style.background = info.color + '11';

  document.getElementById('question-number').textContent = 'ВОПРОС ' + (currentIndex + 1);

  const textEl = document.getElementById('question-text');
  if (currentVersion === 'v2' && q.indexOf('{') !== -1) {
    textEl.innerHTML = substitutePlayersHTML(q);
  } else {
    textEl.textContent = q;
  }

  const fill = ((currentIndex) / deck.length) * 100;
  document.getElementById('progress-fill').style.width = fill + '%';
  document.getElementById('progress-label').textContent = currentIndex + ' / ' + deck.length;
}

function nextQuestion() {
  const card = document.getElementById('question-card');
  card.classList.add('animating');
  setTimeout(() => {
    currentIndex++;
    renderQuestion();
    card.classList.remove('animating');
  }, 200);
}

function skipQuestion() {
  currentIndex++;
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  document.getElementById('game-logo').textContent = 'ПРАВДА';
  showScreen('intro');
}

function restartGame() {
  document.getElementById('game-logo').textContent = 'ПРАВДА';
  showScreen('intro');
}

function addPlayer() {
  const input = document.getElementById('player-input');
  const name = input.value.trim();
  if (!name || players.includes(name)) { input.value = ''; return; }
  players.push(name);
  input.value = '';
  renderPlayerChips();
  updateCount();
}

function removePlayer(name) {
  players = players.filter(function(p) { return p !== name; });
  renderPlayerChips();
  updateCount();
}

function renderPlayerChips() {
  const container = document.getElementById('player-chips');
  container.innerHTML = players.map(function(name) {
    return '<span class="player-chip">' + sanitizeName(name) +
      '<button class="chip-remove" onclick="removePlayer(' + JSON.stringify(name) + ')">×</button></span>';
  }).join('');
}
</script>
</body>
</html>
