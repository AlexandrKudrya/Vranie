<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расскажи историю</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0F0F0F;
    --cream: #F0EBE1;
    --yellow: #E8C84A;
    --rose: #C97A6E;
    --gray: #3A3A3A;
    --mid: #6B6B6B;
  }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  .game-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  .header {
    text-align: center;
  }

  .header h1 {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(28px, 6vw, 42px);
    letter-spacing: 0.08em;
    color: var(--cream);
    line-height: 1;
  }

  .header h1 span {
    color: var(--yellow);
  }

  .header p {
    margin-top: 8px;
    font-size: 13px;
    color: var(--mid);
    letter-spacing: 0.04em;
  }

  /* Card deck shadow illusion */
  .card-stack {
    position: relative;
    width: 100%;
    perspective: 1000px;
  }

  .card-shadow {
    position: absolute;
    inset: 8px -4px -4px 4px;
    background: var(--gray);
    border-radius: 16px;
    z-index: 0;
  }
  .card-shadow-2 {
    position: absolute;
    inset: 16px -8px -8px 8px;
    background: #2a2a2a;
    border-radius: 16px;
    z-index: -1;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--cream);
    border-radius: 16px;
    padding: 44px 36px 36px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transform-origin: center bottom;
    transition: transform 0.08s ease;
    cursor: default;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--yellow);
    border-radius: 16px 16px 0 0;
  }

  .card.flip {
    animation: cardFlip 0.38s ease forwards;
  }

  @keyframes cardFlip {
    0%   { transform: rotateY(0deg) scale(1); }
    40%  { transform: rotateY(90deg) scale(0.96); }
    41%  { transform: rotateY(-90deg) scale(0.96); }
    100% { transform: rotateY(0deg) scale(1); }
  }

  .card-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mid);
    user-select: none;
  }

  .card-text {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 24px 0 20px;
  }

  .card-text p {
    font-family: 'Inter', sans-serif;
    font-size: clamp(17px, 3.5vw, 22px);
    font-weight: 500;
    line-height: 1.45;
    color: var(--black);
  }

  .card-text p strong {
    color: var(--black);
    font-weight: 700;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-counter {
    font-size: 12px;
    color: var(--mid);
    letter-spacing: 0.06em;
  }

  .category-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--rose);
  }

  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .btn {
    flex: 1;
    padding: 16px 20px;
    border: none;
    border-radius: 12px;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 18px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.97); }

  .btn-next {
    background: var(--yellow);
    color: var(--black);
    flex: 3;
  }

  .btn-next:hover { opacity: 0.88; }

  .btn-shuffle {
    background: var(--gray);
    color: var(--cream);
    flex: 1;
    font-size: 20px;
    letter-spacing: 0;
  }

  .btn-shuffle:hover { background: #4a4a4a; }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: var(--gray);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .done-screen {
    display: none;
    text-align: center;
    padding: 40px 24px;
  }

  .done-screen.visible { display: block; }

  .done-screen h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--yellow);
    letter-spacing: 0.08em;
  }

  .done-screen p {
    margin-top: 12px;
    color: var(--mid);
    font-size: 15px;
  }

  .done-screen .btn-next {
    margin-top: 24px;
    display: block;
    width: 100%;
  }

  @media (max-width: 400px) {
    .card { padding: 32px 24px 28px; min-height: 280px; }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="header">
    <h1>РАССКАЖИ <span>ИСТОРИЮ</span></h1>
    <p>когда ты… — игра для компании</p>
  </div>

  <div class="card-stack">
    <div class="card-shadow-2"></div>
    <div class="card-shadow"></div>
    <div class="card" id="card">
      <div class="card-label">Тебе нужно рассказать историю</div>
      <div class="card-text">
        <p id="task-text">Нажми «Следующая карта», чтобы начать игру.</p>
      </div>
      <div class="card-footer">
        <span class="card-counter" id="counter">0 / 200</span>
        <span class="category-tag" id="cat-tag"></span>
      </div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>

  <div class="controls">
    <button class="btn btn-shuffle" id="btn-shuffle" title="Перемешать">⇄</button>
    <button class="btn btn-next" id="btn-next">Следующая карта</button>
  </div>
</div>

let deck = [];
let current = -1;
let started = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function init() {
  deck = tasks.map((t, i) => i);
  shuffle(deck);
  current = -1;
  started = false;
  document.getElementById('task-text').innerHTML = 'Нажми «Следующая карта», чтобы начать игру.';
  document.getElementById('counter').textContent = `0 / ${tasks.length}`;
  document.getElementById('cat-tag').textContent = '';
  document.getElementById('progress').style.width = '0%';
}

function showCard(idx) {
  const task = tasks[deck[idx]];
  const card = document.getElementById('card');
  card.classList.remove('flip');
  void card.offsetWidth;
  card.classList.add('flip');

  setTimeout(() => {
    document.getElementById('task-text').innerHTML =
      `<strong>когда ты</strong> ${task.t.replace(/^когда ты /, '')}`;
    document.getElementById('counter').textContent = `${idx + 1} / ${tasks.length}`;
    document.getElementById('cat-tag').textContent = task.c;
    document.getElementById('progress').style.width = `${((idx + 1) / tasks.length) * 100}%`;
  }, 190);
}

document.getElementById('btn-next').addEventListener('click', () => {
  current++;
  if (current >= tasks.length) {
    shuffle(deck);
    current = 0;
  }
  showCard(current);
  started = true;
});

document.getElementById('btn-shuffle').addEventListener('click', () => {
  shuffle(deck);
  current = -1;
  started = false;
  document.getElementById('task-text').innerHTML = '🔀 Колода перемешана. Нажми «Следующая карта».';
  document.getElementById('counter').textContent = `0 / ${tasks.length}`;
  document.getElementById('cat-tag').textContent = '';
  document.getElementById('progress').style.width = '0%';
  const card = document.getElementById('card');
  card.classList.remove('flip');
  void card.offsetWidth;
  card.classList.add('flip');
});

init();
</script>
</body>
</html>
